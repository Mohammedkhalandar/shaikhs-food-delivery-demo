name: Publish approved fictional demo
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After owner/licensing approval and Pages setup, type PUBLISH_STATIC_DEMO'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: approved-pages-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Mohammedkhalandar/shaikhs-food-delivery-demo' && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_STATIC_DEMO'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
      - run: npm run test:security
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
